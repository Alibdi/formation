{% extends "base.html" %}

{% block title %}Gestion des Utilisateurs - AgencyEd{% endblock %}

{% block content %}
<div class="view-content">
    <div class="flex justify-between items-center mb-10">
        <div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight mb-2">Gestion des Utilisateurs</h2>
            <p class="text-slate-500 font-medium">Administration des comptes agents et responsables.</p>
        </div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-100">
                <tr>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Utilisateur</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Rôle</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Service</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Matricule</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function initUsers() {
        await initBase();
        const res = await fetch('/api/core/users/');
        const list = await res.json();
        const container = document.getElementById('user-table-body');
        container.innerHTML = list.map(u => `
            <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center font-bold text-slate-500">${u.username[0].toUpperCase()}</div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">${u.first_name} ${u.last_name}</p>
                            <p class="text-xs text-slate-400">${u.email}</p>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-[10px] font-bold uppercase">${u.role}</span>
                </td>
                <td class="px-6 py-4 text-sm text-slate-600">${u.service_details?.nom || '---'}</td>
                <td class="px-6 py-4 text-sm font-mono text-slate-400">${u.matricule || '---'}</td>
                <td class="px-6 py-4 text-right">
                    <button class="text-slate-400 hover:text-blue-600 transition-colors"><i class="fas fa-edit"></i></button>
                </td>
            </tr>
        `).join('');
    }

    initUsers();
</script>
{% endblock %}
