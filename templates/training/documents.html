{% extends "base.html" %}

{% block title %}Mes Documents - AgencyEd{% endblock %}

{% block content %}
<div class="view-content">
    <div class="flex justify-between items-center mb-10">
        <div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight mb-2">Documents de Formation</h2>
            <p class="text-slate-500 font-medium">Consultez et téléchargez vos attestations et certificats.</p>
        </div>
        <button onclick="openModal('modal-upload')" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black shadow-xl shadow-blue-200 hover:bg-blue-700 transition-all flex items-center gap-3">
            <i class="fas fa-upload"></i>
            <span>Déposer un document</span>
        </button>
    </div>

    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-100">
                <tr>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Document</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Formation</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Type</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Date</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase text-right">Action</th>
                </tr>
            </thead>
            <tbody id="document-table-body"></tbody>
        </table>
    </div>
</div>

<!-- Modal Upload -->
<div id="modal-upload" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300">
        <div class="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <h3 class="text-xl font-black text-slate-800">Déposer un Document</h3>
            <button onclick="closeModal('modal-upload')" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
        </div>
        <form id="form-upload" class="p-8 space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Formation concernée</label>
                <select name="participation" id="upload-participation-select" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Type de document</label>
                <select name="type" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    <option value="ATTESTATION">Attestation</option>
                    <option value="RAPPORT">Rapport</option>
                    <option value="CERTIFICAT">Certificat</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Fichier (PDF)</label>
                <input type="file" name="fichier" accept=".pdf" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">Envoyer le document</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function initDocuments() {
        await initBase();
        refreshDocuments();
        fillParticipations();
    }

    async function refreshDocuments() {
        const res = await fetch('/api/training/documents/');
        const list = await res.json();
        const container = document.getElementById('document-table-body');
        container.innerHTML = list.map(d => `
            <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-blue-50 text-blue-600 rounded flex items-center justify-center shadow-sm"><i class="fas fa-file-pdf"></i></div>
                        <span class="font-bold text-slate-800 text-sm">Document #${d.id}</span>
                    </div>
                </td>
                <td class="px-6 py-4 text-sm text-slate-600">${d.participation}</td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 bg-slate-100 text-slate-500 rounded text-[10px] font-bold uppercase">${d.type}</span>
                </td>
                <td class="px-6 py-4 text-xs text-slate-400">${new Date(d.date_upload).toLocaleDateString()}</td>
                <td class="px-6 py-4 text-right">
                    <a href="${d.fichier}" target="_blank" class="text-blue-600 hover:text-blue-800 font-black text-xs">Télécharger</a>
                </td>
            </tr>
        `).join('');
    }

    async function fillParticipations() {
        const res = await fetch('/api/training/participations/');
        const list = await res.json();
        const select = document.getElementById('upload-participation-select');
        select.innerHTML = list.filter(p => p.statut === 'VALIDE').map(p => `
            <option value="${p.id}">${p.formation_details.titre}</option>
        `).join('');
    }

    document.getElementById('form-upload').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const res = await fetch('/api/training/documents/', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCookie('csrftoken') },
            body: formData
        });
        if (res.ok) {
            toast('Document envoyé !');
            closeModal('modal-upload');
            refreshDocuments();
        }
    });

    function openModal(id) {
        const el = document.getElementById(id);
        el.classList.remove('hidden');
        setTimeout(() => { el.classList.add('opacity-100'); el.children[0].classList.add('scale-100'); }, 10);
    }

    function closeModal(id) {
        const el = document.getElementById(id);
        el.classList.remove('opacity-100');
        el.children[0].classList.remove('scale-100');
        setTimeout(() => el.classList.add('hidden'), 300);
    }

    initDocuments();
</script>
{% endblock %}
