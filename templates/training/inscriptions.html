{% extends "base.html" %}

{% block title %}Participations - AgencyEd{% endblock %}

{% block content %}
<div class="view-content">
    <div class="flex justify-between items-center mb-10">
        <div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight mb-2">Suivi des Participations</h2>
            <p class="text-slate-500 font-medium">Gérez les inscriptions et validez les demandes.</p>
        </div>
        <button id="btn-export-excel" class="bg-green-600 text-white px-8 py-4 rounded-2xl font-black shadow-xl shadow-green-100 hover:bg-green-700 transition-all flex items-center gap-3 hidden">
            <i class="fas fa-file-excel"></i>
            <span>Exporter Excel</span>
        </button>
    </div>

    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-100">
                <tr>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Agent</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Formation</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Statut</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Date</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="participation-table-body">
                <!-- Rows -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function initInscriptions() {
        await initBase();
        if (currentUser.role === 'ADMIN' || currentUser.role === 'OPERATEUR') {
            const btn = document.getElementById('btn-export-excel');
            btn.classList.remove('hidden');
            btn.onclick = exportExcel;
        }
        refreshParticipations();
    }

    function exportExcel() {
        window.location.href = '/api/training/participations/export_excel/';
    }

    async function refreshParticipations() {
        const res = await fetch('/api/training/participations/');
        const list = await res.json();
        const container = document.getElementById('participation-table-body');
        
        container.innerHTML = list.map(p => `
            <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center font-bold text-slate-500">${p.agent_details.username[0].toUpperCase()}</div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">${p.agent_details.first_name} ${p.agent_details.last_name}</p>
                            <p class="text-[10px] text-slate-400">${p.agent_details.service_details?.nom || '---'}</p>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4">
                    <p class="text-sm font-bold text-slate-700">${p.formation_details.titre}</p>
                    <p class="text-[10px] text-slate-400">${p.formation_details.lieu}</p>
                </td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 ${getStatusClass(p.statut)} rounded text-[10px] font-bold uppercase">${p.statut}</span>
                </td>
                <td class="px-6 py-4 text-xs text-slate-400">${new Date(p.date_inscription).toLocaleDateString()}</td>
                <td class="px-6 py-4 text-right">
                    ${(currentUser.role === 'ADMIN' || currentUser.role === 'OPERATEUR' || (currentUser.role === 'RESPONSABLE' && p.statut === 'INSCRIT')) ? `
                        <button onclick="validateP(${p.id})" class="text-green-600 hover:text-green-800 font-black text-xs mr-4">${p.statut === 'INSCRIT' ? 'Valider' : ''}</button>
                    ` : ''}
                    ${(currentUser.role === 'ADMIN' || currentUser.role === 'OPERATEUR') && p.statut === 'VALIDE' ? `
                        <button onclick="markAsFinished(${p.id})" class="text-purple-600 hover:text-purple-800 font-black text-xs mr-4">Terminer</button>
                    ` : ''}
                    ${p.ordre_mission ? `<a href="${p.ordre_mission}" target="_blank" class="text-blue-600 hover:text-blue-800 font-black text-xs">Ordre</a>` : ''}
                </td>
            </tr>
        `).join('');
    }

    async function markAsFinished(id) {
        const res = await fetch(`/api/training/participations/${id}/`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ statut: 'TERMINE' })
        });
        if (res.ok) {
            toast('Formation marquée comme terminée !');
            refreshParticipations();
        }
    }

    function getStatusClass(statut) {
        switch(statut) {
            case 'VALIDE': return 'bg-green-50 text-green-600';
            case 'INSCRIT': return 'bg-blue-50 text-blue-600';
            case 'TERMINE': return 'bg-purple-50 text-purple-600';
            default: return 'bg-slate-50 text-slate-600';
        }
    }

    async function validateP(id) {
        const res = await fetch(`/api/training/participations/${id}/valider/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        if (res.ok) {
            toast('Participation validée !');
            refreshParticipations();
        } else {
            toast('Erreur de validation', 'error');
        }
    }

    initInscriptions();
</script>
{% endblock %}
