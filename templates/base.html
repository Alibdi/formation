<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion des Formations{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass-sidebar { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .sidebar-item.active { background: #2563eb; color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2); }
        .view-content { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast-enter { transform: translateX(100%); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-active { transform: translateX(0); }
    </style>
</head>
<body class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-72 glass-sidebar border-r border-slate-200 flex flex-col fixed h-full z-40">
        <div class="p-8 flex items-center gap-4">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div>
                <h1 class="font-black text-slate-800 tracking-tighter text-xl">AGENCY<span class="text-blue-600">ED</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Training v1.2</p>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-4" id="sidebar-nav">
            <a href="/" class="sidebar-item w-full flex items-center gap-3 p-3 rounded-xl transition-all text-slate-600" id="nav-dashboard">
                <i class="fas fa-th-large w-5"></i>
                <span class="font-medium">Tableau de bord</span>
            </a>
            <a href="/formations/" class="sidebar-item w-full flex items-center gap-3 p-3 rounded-xl transition-all text-slate-600" id="nav-formations">
                <i class="fas fa-book w-5"></i>
                <span class="font-medium">Catalogue</span>
            </a>
            <a href="/inscriptions/" class="sidebar-item w-full flex items-center gap-3 p-3 rounded-xl transition-all text-slate-600" id="nav-inscriptions">
                <i class="fas fa-calendar-check w-5"></i>
                <span class="font-medium">Participations</span>
            </a>
            <a href="/documents/" class="sidebar-item w-full flex items-center gap-3 p-3 rounded-xl transition-all text-slate-600" id="nav-documents">
                <i class="fas fa-folder-open w-5"></i>
                <span class="font-medium">Documents</span>
            </a>
            <a href="/stats/" class="sidebar-item w-full flex items-center gap-3 p-3 rounded-xl transition-all text-slate-600" id="nav-stats">
                <i class="fas fa-chart-pie w-5"></i>
                <span class="font-medium">Statistiques</span>
            </a>
            <a href="/users/" class="sidebar-item w-full flex items-center gap-3 p-3 rounded-xl transition-all text-slate-600 hidden" id="nav-users">
                <i class="fas fa-user-cog w-5"></i>
                <span class="font-medium">Utilisateurs</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-200 bg-slate-50/50">
            <div class="flex items-center gap-3 p-3">
                <div class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center font-bold text-slate-500" id="user-avatar">?</div>
                <div class="flex-1">
                    <p class="text-sm font-black text-slate-800 leading-none mb-1" id="user-name">Chargement...</p>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter" id="user-role">...</p>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-power-off"></i></button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-72 p-10">
        <div id="toast-container" class="fixed top-10 right-10 z-[100] space-y-4"></div>
        {% block content %}{% endblock %}
    </main>

    <script>
        let currentUser = null;

        async function initBase() {
            try {
                const res = await fetch('/api/core/users/me/');
                if (!res.ok) {
                    window.location.href = '/login/';
                    return;
                }
                currentUser = await res.json();
                document.getElementById('user-name').innerText = `${currentUser.first_name} ${currentUser.last_name}` || currentUser.username;
                document.getElementById('user-role').innerText = currentUser.role;
                document.getElementById('user-avatar').innerText = currentUser.first_name ? currentUser.first_name[0] : currentUser.username[0].toUpperCase();
                
                if (currentUser.role === 'ADMIN' || currentUser.role === 'OPERATEUR') {
                    document.getElementById('nav-users').classList.remove('hidden');
                }
                
                // Highlight active nav
                const path = window.location.pathname;
                document.querySelectorAll('.sidebar-item').forEach(el => {
                    if (el.getAttribute('href') === path) {
                        el.classList.add('active', 'text-white', 'bg-blue-600');
                        el.classList.remove('text-slate-600');
                    }
                });
            } catch (err) {
                console.error(err);
                window.location.href = '/login/';
            }
        }

        function logout() {
            fetch('/api/auth/logout/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') }
            }).then(() => window.location.href = '/login/');
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function toast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `p-4 rounded-2xl shadow-xl border flex items-center gap-3 min-w-[300px] toast-enter ${
                type === 'success' ? 'bg-white border-green-100 text-slate-800' : 'bg-red-600 text-white border-red-500'
            }`;
            el.innerHTML = `
                <div class="w-8 h-8 rounded-full flex items-center justify-center ${type === 'success' ? 'bg-green-50 text-green-600' : 'bg-red-500 text-white'}">
                    <i class="fas ${type === 'success' ? 'fa-check' : 'fa-exclamation-triangle'}"></i>
                </div>
                <span class="font-bold text-sm">${msg}</span>
            `;
            container.appendChild(el);
            setTimeout(() => el.classList.add('toast-active'), 10);
            setTimeout(() => {
                el.classList.remove('toast-active');
                setTimeout(() => el.remove(), 300);
            }, 4000);
        }

        initBase();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
